name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - develop
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Firebase Hosting configuration and checkout
        run: node scripts/validate-firebase-hosting.js
        env:
          FIREBASE_PROJECT_ID: my-project-1525790600392
          EXPECTED_DEPLOY_BRANCH: develop
          DEPLOY_COMPARE_REF: origin/develop
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PROJECT_1525790600392 }}
          channelId: live
          projectId: my-project-1525790600392
        env:
          DEPLOY_COMPARE_REF: origin/develop
