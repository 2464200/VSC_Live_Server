# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - develop
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Validate Firebase Hosting configuration and checkout
        run: node scripts/validate-firebase-hosting.js
        env:
          FIREBASE_PROJECT_ID: my-project-1525790600392
          EXPECTED_DEPLOY_BRANCH: develop
          DEPLOY_COMPARE_REF: origin/develop
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MY_PROJECT_1525790600392 }}
      - name: Deploy Firebase Authentication, Realtime Database rules, and Hosting
        run: npx firebase-tools deploy --only auth,database,hosting --project my-project-1525790600392 --non-interactive
        env:
          FIREBASE_PROJECT_ID: my-project-1525790600392
          DEPLOY_COMPARE_REF: origin/develop
