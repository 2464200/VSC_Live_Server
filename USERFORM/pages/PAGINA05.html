<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USERFORM - PAGINA05</title>
  <link rel="stylesheet" href="../assets/css/userform.css" />
  <style>
    body.p05-body {
      margin: 0;
      background: #f2f2f2;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .p05-form {
      position: relative;
      width: min(1000px, 100% - 24px);
      min-height: 740px;
      margin: 12px auto;
      padding: 18px 16px 56px;
      border: 1px solid #c7c7c7;
      background: #f8f8f8;
      overflow: hidden;
    }

    .p05-title {
      margin: 0;
      font-size: 15px;
      font-weight: 500;
      color: #4b4b4b;
    }

    .p05-top {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 190px 190px 1fr 92px;
      gap: 14px;
      align-items: start;
    }

    .p05-flat-btn {
      border: 1px solid #666;
      font-weight: 700;
      font-size: 13px;
      line-height: 1.15;
      color: #0a0a0a;
      cursor: pointer;
      min-height: 56px;
      background: #ececec;
    }

    .p05-flat-btn.green {
      background: #15c214;
    }

    .p05-flat-btn.red {
      background: #ee1f1f;
    }

    .p05-webcam-box {
      display: grid;
      gap: 6px;
    }

    .p05-webcam-box select {
      width: 100%;
      height: 52px;
      border: 2px solid #9e9e9e;
      background: #fff;
      font-size: 14px;
      padding: 4px 8px;
    }

    .p05-webcam-box label {
      font-size: 12px;
      color: #1e1e1e;
    }

    .p05-test-btn {
      margin-top: 6px;
      border: 1px solid #a4a07b;
      background: #f8f4d3;
      min-height: 34px;
      cursor: pointer;
      font-size: 13px;
    }

    .p05-logo {
      width: 86px;
      height: 86px;
      object-fit: cover;
      border: 1px solid #8d8d8d;
      background: #fff;
      justify-self: end;
    }

    .p05-main-box {
      margin-top: 16px;
      width: 364px;
      height: 280px;
      border: 1px solid #9f9f9f;
      background: #fafafa;
      position: relative;
      padding: 38px 8px 8px;
      overflow: hidden;
    }

    .p05-main-box .caption {
      position: absolute;
      top: 8px;
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      transform: scaleX(0.62);
      transform-origin: center;
      letter-spacing: 0.01em;
    }

    .p05-recordings-list {
      height: calc(100% - 22px);
      border: 1px solid #b1b1b1;
      background: #fff;
      overflow: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .p05-recordings-list li {
      padding: 6px 8px;
      border-bottom: 1px solid #ececec;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .p05-recordings-list li:hover,
    .p05-recordings-list li.is-active {
      background: #d8e9ff;
    }

    .p05-recordings-hint {
      margin: 3px 0 0;
      font-size: 11px;
      color: #4b4b4b;
    }

    .p05-webcam-image {
      margin-top: 52px;
      width: 186px;
      height: 112px;
      border: 1px solid #999;
      display: block;
      background: #fff;
      position: relative;
      overflow: hidden;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .p05-webcam-image.is-live {
      border-color: #d0322b;
      box-shadow: 0 0 0 2px rgba(208, 50, 43, 0.2);
    }

    .p05-webcam-image img,
    .p05-webcam-image video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .p05-webcam-image video {
      background: #000;
    }

    .p05-live-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      z-index: 2;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff;
      background: #d0322b;
      border-radius: 999px;
      padding: 2px 7px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      animation: p05-live-pulse 1s infinite;
      display: none;
    }

    .p05-webcam-image.is-live .p05-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    @keyframes p05-live-pulse {
      0% { opacity: 1; }
      50% { opacity: 0.55; }
      100% { opacity: 1; }
    }

    .p05-hidden {
      display: none !important;
    }

    .p05-live-row {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .p05-live-row .p05-flat-btn {
      min-height: 86px;
    }

    .p05-live-row .green {
      width: 186px;
      font-size: 34px;
      transform: scaleX(0.6);
      transform-origin: left center;
      white-space: nowrap;
      overflow: hidden;
      text-align: left;
      padding-left: 8px;
    }

    .p05-live-row .red {
      width: 100px;
      font-size: 30px;
      transform: scaleX(0.62);
      transform-origin: left center;
      white-space: nowrap;
      overflow: hidden;
      text-align: left;
      padding-left: 6px;
    }

    .p05-bottom-bar {
      position: absolute;
      right: 12px;
      bottom: 10px;
      display: flex;
      gap: 8px;
    }

    .p05-bottom-bar a,
    .p05-bottom-bar button {
      min-width: 84px;
      height: 28px;
      border: 1px solid #8a8a8a;
      background: #efefef;
      color: #111;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    .p05-side-tools {
      position: absolute;
      right: 12px;
      top: 250px;
      width: 300px;
      display: grid;
      gap: 8px;
    }

    .p05-side-tools select,
    .p05-side-tools button {
      min-height: 34px;
      border: 1px solid #9a9a9a;
      background: #fff;
      padding: 6px 8px;
      font-size: 13px;
    }

    .p05-side-tools button {
      background: #f1f1f1;
      cursor: pointer;
    }

    .p05-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .p05-chip {
      border: 1px solid #8f8f8f;
      background: #fff;
      font-size: 12px;
      padding: 3px 7px;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
    }

    .p05-status {
      border: 1px solid #9a9a9a;
      background: #fff;
      font-size: 12px;
      padding: 8px;
      min-height: 56px;
    }

    .p05-hidden-meta {
      display: none;
    }

    @media (max-width: 860px) {
      .p05-form {
        min-height: 0;
        overflow: visible;
      }

      .p05-top {
        grid-template-columns: 1fr 1fr;
      }

      .p05-side-tools,
      .p05-bottom-bar {
        position: static;
      }

      .p05-main-box,
      .p05-side-tools,
      .p05-logo {
        width: 100%;
      }

      .p05-logo {
        height: auto;
        max-width: 130px;
        justify-self: start;
      }

      .p05-main-box {
        height: 210px;
      }

      .p05-live-row .green,
      .p05-live-row .red {
        transform: none;
        width: 100%;
        text-align: center;
        padding-left: 0;
      }

      .p05-bottom-bar {
        margin-top: 12px;
        justify-content: flex-end;
      }
    }
  </style>
  <script defer src="../js/userform-registry.js"></script>
  <script defer src="../js/userform-page.js"></script>
  <script defer src="../js/pagina05-actions.js"></script>
</head>
<body class="p05-body">
  <main class="p05-form">
    <h1 id="form-name" class="p05-title">frmPagina05</h1>

    <section class="p05-top" aria-label="Comandi principali">
      <button id="btn-rec-start-05" class="p05-flat-btn green" type="button">AVVIA REGISTRAZIONE</button>
      <button id="btn-rec-stop-05" class="p05-flat-btn red" type="button">STOP REGISTRAZIONE</button>

      <div class="p05-webcam-box">
        <select id="camera-name-05" aria-label="Selezione webcam"></select>
        <label for="camera-name-05">Scegliere quale TELECAMERA utilizzare</label>
        <button id="btn-autotest-tools" class="p05-test-btn" type="button">TEST SOFTWARE PER WEBCAM</button>
      </div>

      <img class="p05-logo" src="../../archivio/logo_daniel_west.jpg" alt="Logo Daniel West" />
    </section>

    <section class="p05-main-box" aria-label="Area riproduzione">
      <div class="caption">RIPRODUCI REGISTRAZIONE</div>
      <ul id="recordings-play-list-05" class="p05-recordings-list" aria-label="Elenco registrazioni"></ul>
      <p class="p05-recordings-hint">Doppio click su un file per riprodurlo sul monitor secondario.</p>
    </section>

    <div id="webcam-shell-05" class="p05-webcam-image" aria-label="Anteprima webcam locale">
      <span id="webcam-live-badge-05" class="p05-live-badge">LIVE</span>
      <img id="webcam-slide-05" src="../../archivio/webcam.jpeg" alt="Webcam" />
      <video id="webcam-preview-05" class="p05-hidden" autoplay muted playsinline></video>
    </div>

    <div class="p05-live-row" aria-label="Controllo ripresa diretta">
      <button id="btn-vlc-start" class="p05-flat-btn green" type="button">RIPRESA VIDEO IN DIRETTA</button>
      <button id="btn-vlc-stop" class="p05-flat-btn red" type="button">STOP RIPRESA VIDEO</button>
    </div>

    <aside class="p05-side-tools" aria-label="Strumenti conversione e stato">
      <select id="recording-list-05" aria-label="Elenco registrazioni">
        <option value="">Nessun file MKV</option>
      </select>
      <button id="btn-convert-play-05" type="button">CONVERTI MP4 + PLAY VLC</button>

      <div class="p05-chips" aria-label="Metriche webcam">
        <span id="cam-codec-chip" class="p05-chip">Codec: -</span>
        <span id="cam-size-chip" class="p05-chip">Size: -</span>
        <span id="cam-fps-chip" class="p05-chip">FPS: -</span>
        <span id="vlc-state-chip" class="p05-chip">VLC: OFF</span>
        <span id="rec-state-chip-05" class="p05-chip">REC: OFF</span>
      </div>

      <div id="pagina05-status" class="p05-status" role="status" aria-live="polite"><strong>Stato:</strong> pronto.</div>
    </aside>

    <nav class="p05-bottom-bar" aria-label="Navigazione">
      <a href="INDICE.html">Indice</a>
      <button id="btn-close-pagina05" type="button">CHIUDI</button>
    </nav>

    <div class="p05-hidden-meta" aria-hidden="true">
      <strong id="form-name-copy">PAGINA05</strong>
      <strong id="form-caption">-</strong>
      <strong id="form-size">-</strong>
      <a id="prev-form" href="#">Form precedente</a>
      <a id="next-form" href="#">Form successivo</a>
    </div>
  </main>
</body>
</html>
