<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USERFORM - PUBBLICA</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #181818;
      --line: #ff9f33;
      --text: #f6f1ee;
      --muted: #d9d3d0;
      --shadow: rgba(255, 149, 0, 0.45);
      --accent: #ff7f00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .window {
      position: relative;
      width: min(92vw, 760px);
      min-height: 430px;
      border: 5px solid var(--line);
      border-radius: 26px;
      background: rgba(17, 17, 17, 0.9);
      box-shadow: 0 0 18px var(--shadow), 0 0 34px rgba(255, 165, 0, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 48px;
      animation: neonPulse 2s infinite ease-in-out;
    }

    .content {
      width: 100%;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px 28px;
    }

    .message {
      display: inline-block;
      max-width: 100%;
      margin: 0;
      font-size: clamp(30px, 3vw, 94px);
      line-height: 1.1;
      letter-spacing: -0.05em;
      font-weight: 950;
      color: var(--text);
      text-shadow: 0 0 18px rgba(255, 167, 55, 0.35);
      word-break: break-word;
      white-space: normal;
      padding: 10px 8px;
    }

    .close-button {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #111;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }

    .close-button:hover {
      filter: brightness(1.1);
    }

    .hidden {
      display: none !important;
    }

    .carousel-root {
      position: fixed;
      inset: 0;
      background: #000;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .carousel-stage {
      position: relative;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(255, 127, 0, 0.5);
      border-radius: 18px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(255, 130, 0, 0.15), #050505 60%);
    }

    .carousel-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 400ms ease, transform 1200ms linear;
      will-change: transform, opacity;
    }

    .carousel-image.active {
      opacity: 1;
      transform: scale(1);
    }

    .carousel-caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 16px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.05));
      color: #f7f7f7;
      font-size: clamp(14px, 1.5vw, 24px);
      text-align: center;
      letter-spacing: 0.02em;
    }

    .carousel-error {
      margin: 0;
      font-size: clamp(22px, 2.4vw, 40px);
      text-align: center;
      color: #ffd6a6;
      max-width: 80ch;
      line-height: 1.25;
    }

    @keyframes neonPulse {
      0% { box-shadow: 0 0 8px var(--shadow); }
      50% { box-shadow: 0 0 25px rgba(255, 206, 99, 0.7); }
      100% { box-shadow: 0 0 8px var(--shadow); }
    }
  </style>
</head>
<body>
  <button class="close-button" type="button" onclick="closePage()">Chiudi</button>

  <div id="text-root" class="window">
    <div class="content">
      <p id="publishing-message" class="message">la serata inizierà a breve</p>
    </div>
  </div>

  <div id="carousel-root" class="carousel-root hidden">
    <div class="carousel-stage">
      <img id="carousel-image" class="carousel-image" alt="Slide servizio" />
      <div id="carousel-caption" class="carousel-caption"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const text = params.get('text') || 'la serata inizierà a breve';
    const mode = params.get('mode') || 'text';
    const carouselId = params.get('id') || '';
    const intervalFromQuery = Number(params.get('interval') || 6);
    const carouselStoragePrefix = 'userform-servizio-carousel:';
    const logoStoragePrefix = 'userform-servizio-logo:';
    const node = document.getElementById('publishing-message');
    const textRoot = document.getElementById('text-root');
    const carouselRoot = document.getElementById('carousel-root');
    const carouselImage = document.getElementById('carousel-image');
    const carouselCaption = document.getElementById('carousel-caption');
    let carouselTimer = null;

    function fitTextSize() {
      if (!node) return;

      const base = 96;
      const length = Math.max(1, text.length);
      const maxWidth = Math.min(window.innerWidth * 0.72, 760);
      const fontSize = Math.max(32, Math.min(base, maxWidth / Math.max(6, length * 0.7)));

      node.style.fontSize = `${fontSize}px`;
      node.style.lineHeight = '1.02';
    }

    function showCarouselError(message) {
      if (!carouselRoot) return;
      carouselRoot.classList.remove('hidden');
      if (textRoot) {
        textRoot.classList.add('hidden');
      }
      carouselRoot.innerHTML = `<p class="carousel-error">${message}</p>`;
    }

    function normalizeInterval(intervalSecRaw) {
      const candidate = Number(intervalSecRaw || 6);
      if (!Number.isFinite(candidate)) return 6;
      return Math.min(60, Math.max(1, Math.round(candidate)));
    }

    function startCarousel(slides, intervalSec) {
      if (!Array.isArray(slides) || slides.length === 0 || !carouselImage || !carouselCaption || !carouselRoot) {
        showCarouselError('Nessuna immagine disponibile per la carrellata.');
        return;
      }

      carouselRoot.classList.remove('hidden');
      if (textRoot) {
        textRoot.classList.add('hidden');
      }

      let currentIndex = 0;
      const safeIntervalSec = normalizeInterval(intervalSec);

      const renderSlide = () => {
        const slide = slides[currentIndex];
        carouselImage.classList.remove('active');

        window.requestAnimationFrame(() => {
          carouselImage.src = String(slide?.url || slide?.dataUrl || '');
          carouselCaption.textContent = `${currentIndex + 1}/${slides.length}`;
          carouselImage.classList.add('active');
        });
      };

      renderSlide();
      carouselTimer = window.setInterval(() => {
        currentIndex = (currentIndex + 1) % slides.length;
        renderSlide();
      }, safeIntervalSec * 1000);
    }

    function initTextMode() {
      if (node) {
        node.textContent = text;
        fitTextSize();
        window.addEventListener('resize', fitTextSize);
      }
    }

    function initLocalCarouselMode() {
      if (!carouselId) {
        showCarouselError('ID carrellata mancante. Riapri la pagina dal pannello SERVIZIO.');
        return;
      }

      let payload = null;
      try {
        const raw = localStorage.getItem(`${carouselStoragePrefix}${carouselId}`);
        payload = raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.error('Errore lettura carrellata da localStorage:', error);
      }

      if (!payload || !Array.isArray(payload.slides) || payload.slides.length === 0) {
        showCarouselError('Carrellata non trovata. Seleziona di nuovo le immagini e ripubblica.');
        return;
      }

      startCarousel(payload.slides, payload.intervalSec);
    }

    function initLogoMode() {
      if (!carouselId) {
        showCarouselError('ID immagine mancante. Riapri la pagina dal pannello SERVIZIO.');
        return;
      }

      let payload = null;
      try {
        const raw = localStorage.getItem(`${logoStoragePrefix}${carouselId}`);
        payload = raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.error('Errore lettura immagine da localStorage:', error);
      }

      if (!payload?.dataUrl || !carouselImage || !carouselCaption || !carouselRoot) {
        showCarouselError('Immagine non trovata. Selezionala di nuovo e ripubblica.');
        return;
      }

      carouselRoot.classList.remove('hidden');
      if (textRoot) textRoot.classList.add('hidden');
      carouselImage.src = payload.dataUrl;
      carouselImage.alt = payload.name || 'Immagine servizio';
      carouselImage.classList.add('active');
      carouselCaption.textContent = '';
    }

    async function initFolderCarouselMode() {
      try {
        const response = await fetch(`/api/servizio/images?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();
        const slides = Array.isArray(payload?.files) ? payload.files : [];
        if (!slides.length) {
          showCarouselError('La cartella C:/VSC_Servizio non contiene immagini valide.');
          return;
        }

        startCarousel(slides, intervalFromQuery);
      } catch (error) {
        console.error('Errore caricamento carrellata da cartella:', error);
        showCarouselError('Errore caricamento immagini da C:/VSC_Servizio. Verifica il server.');
      }
    }

    if (mode === 'logo') {
      initLogoMode();
    } else if (mode === 'carousel') {
      initLocalCarouselMode();
    } else if (mode === 'folder') {
      initFolderCarouselMode();
    } else {
      initTextMode();
    }

    function closePage() {
      if (carouselTimer) {
        window.clearInterval(carouselTimer);
      }
      window.close();
      try {
        window.open('', '_self').close();
      } catch (error) {
        console.warn('Chiusura finestra non supportata dal browser.', error);
      }
    }
  </script>
</body>
</html>
