<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USERFORM - PUBBLICA</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #181818;
      --line: #ff9f33;
      --text: #f6f1ee;
      --muted: #d9d3d0;
      --shadow: rgba(255, 149, 0, 0.45);
      --accent: #ff7f00;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .window {
      position: relative;
      width: min(92vw, 760px);
      min-height: 430px;
      border: 5px solid var(--line);
      border-radius: 26px;
      background: rgba(17, 17, 17, 0.9);
      box-shadow: 0 0 18px var(--shadow), 0 0 34px rgba(255, 165, 0, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 48px;
      animation: neonPulse 2s infinite ease-in-out;
    }

    .content {
      width: 100%;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 36px 28px;
    }

    .message {
      display: inline-block;
      max-width: 100%;
      margin: 0;
      font-size: clamp(30px, 3vw, 94px);
      line-height: 1.1;
      letter-spacing: -0.05em;
      font-weight: 950;
      color: var(--text);
      text-shadow: 0 0 18px rgba(255, 167, 55, 0.35);
      word-break: break-word;
      white-space: normal;
      padding: 10px 8px;
    }

    .close-button {
      position: fixed;
      top: 18px;
      left: 18px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #111;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    }

    .close-button:hover {
      filter: brightness(1.1);
    }

    @keyframes neonPulse {
      0% { box-shadow: 0 0 8px var(--shadow); }
      50% { box-shadow: 0 0 25px rgba(255, 206, 99, 0.7); }
      100% { box-shadow: 0 0 8px var(--shadow); }
    }
  </style>
</head>
<body>
  <button class="close-button" type="button" onclick="closePage()">Chiudi</button>

  <div class="window">
    <div class="content">
      <p id="publishing-message" class="message">la serata inizierà a breve</p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const text = params.get('text') || 'la serata inizierà a breve';
    const node = document.getElementById('publishing-message');

    function fitTextSize() {
      if (!node) return;

      const base = 96;
      const length = Math.max(1, text.length);
      const maxWidth = Math.min(window.innerWidth * 0.72, 760);
      const fontSize = Math.max(32, Math.min(base, maxWidth / Math.max(6, length * 0.7)));

      node.style.fontSize = `${fontSize}px`;
      node.style.lineHeight = '1.02';
    }

    if (node) {
      node.textContent = text;
      fitTextSize();
      window.addEventListener('resize', fitTextSize);
    }

    function closePage() {
      window.close();
      try {
        window.open('', '_self').close();
      } catch (error) {
        console.warn('Chiusura finestra non supportata dal browser.', error);
      }
    }
  </script>

    <script src=/nav.js></script></body>
</html>
