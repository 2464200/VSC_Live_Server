<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servizio - Scegli immagine</title>
  <style>
    :root { --bg: #dfe3df; --panel: #eef0ed; --text: #202020; --accent: #ff7f00; --line: #9f9f9f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; background: #b9babb; color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; }
    .window { width: min(100%, 760px); min-height: 600px; margin: 0 auto; border: 1px solid var(--line); background: var(--bg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
    header { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid rgba(0,0,0,.2); font-size: 13px; font-weight: 700; }
    main { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 30px 24px 36px; text-align: center; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 500; }
    p { margin: 0; color: #4b4b4b; }
    .dropzone { width: min(100%, 520px); min-height: 300px; display: grid; place-items: center; padding: 20px; border: 2px dashed #777; background: rgba(255,255,255,.28); cursor: pointer; }
    .dropzone.is-dragging { border-color: var(--accent); background: rgba(255,127,0,.12); }
    .dropzone span { color: #555; }
    .preview { display: none; width: 100%; height: 300px; object-fit: contain; background: #111; }
    .preview.is-visible { display: block; }
    .file-name { min-height: 20px; font-size: 13px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    button, .select-button { min-height: 42px; padding: 10px 18px; border: 1px solid rgba(0,0,0,.35); background: #f0f0f0; color: #111; font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); font-weight: 700; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    input[type="file"] { display: none; }
    .error { min-height: 20px; color: #8f0000; font-size: 13px; }
  </style>
</head>
<body>
  <section class="window">
    <header><span>Servizio / Scegli immagine</span><button id="close-btn" type="button" aria-label="Chiudi">X</button></header>
    <main>
      <h1>Scegli l'immagine da pubblicare</h1>
      <p>Seleziona un'immagine dal PC per visualizzarla sul monitor secondario.</p>
      <label id="dropzone" class="dropzone" for="image-input">
        <span id="dropzone-text">Clicca qui o trascina un'immagine</span>
        <img id="preview" class="preview" alt="Anteprima immagine selezionata" />
      </label>
      <input id="image-input" type="file" accept="image/*" />
      <div id="file-name" class="file-name"></div>
      <div class="actions">
        <button id="select-btn" class="select-button" type="button">Scegli immagine</button>
        <button id="publish-btn" class="primary" type="button" disabled>Pubblica immagine</button>
        <button id="cancel-btn" type="button">Annulla</button>
      </div>
      <div id="error" class="error" aria-live="polite"></div>
    </main>
  </section>
  <script>
    (() => {
      const input = document.getElementById('image-input');
      const dropzone = document.getElementById('dropzone');
      const dropzoneText = document.getElementById('dropzone-text');
      const preview = document.getElementById('preview');
      const fileName = document.getElementById('file-name');
      const publishButton = document.getElementById('publish-btn');
      const error = document.getElementById('error');
      let selectedFile = null;

      function setFile(file) {
        error.textContent = '';
        if (!file || !file.type.startsWith('image/')) {
          selectedFile = null;
          preview.removeAttribute('src');
          preview.classList.remove('is-visible');
          dropzoneText.style.display = '';
          fileName.textContent = '';
          publishButton.disabled = true;
          if (file) error.textContent = 'Seleziona un file immagine valido.';
          return;
        }
        selectedFile = file;
        preview.src = URL.createObjectURL(file);
        preview.classList.add('is-visible');
        dropzoneText.style.display = 'none';
        fileName.textContent = file.name;
        publishButton.disabled = false;
      }

      input.addEventListener('change', () => setFile(input.files[0]));
      document.getElementById('select-btn').addEventListener('click', () => input.click());
      dropzone.addEventListener('dragover', (event) => { event.preventDefault(); dropzone.classList.add('is-dragging'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-dragging'));
      dropzone.addEventListener('drop', (event) => { event.preventDefault(); dropzone.classList.remove('is-dragging'); setFile(event.dataTransfer.files[0]); });

      publishButton.addEventListener('click', () => {
        if (!selectedFile) return;
        const reader = new FileReader();
        reader.onload = () => {
          const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const payload = { id, name: selectedFile.name, dataUrl: reader.result };
          localStorage.setItem(`userform-servizio-logo:${id}`, JSON.stringify(payload));
          localStorage.setItem('userform-servizio-logo:last', JSON.stringify(payload));
          const route = `/USERFORM/pages/SERVIZIO-PUBBLICA.html?mode=logo&id=${encodeURIComponent(id)}`;
          if (window.electronAPI?.windowManager?.openSecondaryPage) {
            window.electronAPI.windowManager.openSecondaryPage({ path: route }).catch(() => window.open(`SERVIZIO-PUBBLICA.html?mode=logo&id=${encodeURIComponent(id)}`, '_blank'));
          } else {
            window.open(`SERVIZIO-PUBBLICA.html?mode=logo&id=${encodeURIComponent(id)}`, '_blank');
          }
          window.close();
        };
        reader.readAsDataURL(selectedFile);
      });

      ['close-btn', 'cancel-btn'].forEach((id) => document.getElementById(id).addEventListener('click', () => window.close()));
    })();
  </script>
</body>
</html>
