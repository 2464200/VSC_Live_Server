<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servizio - Scegli immagine</title>
  <style>
    :root { --bg: #dfe3df; --panel: #eef0ed; --text: #202020; --accent: #ff7f00; --line: #9f9f9f; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; background: #b9babb; color: var(--text); font-family: "Segoe UI", Tahoma, sans-serif; }
    .window { width: min(100%, 1180px); min-height: 600px; margin: 0 auto; border: 1px solid var(--line); background: var(--bg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
    header { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid rgba(0,0,0,.2); font-size: 13px; font-weight: 700; }
    main { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr); gap: 24px; align-items: start; padding: 24px; text-align: center; }
    .display-preview-panel { min-width: 0; text-align: left; }
    .display-preview-panel h1 { margin-bottom: 8px; }
    .display-preview-frame { width: 100%; aspect-ratio: 16 / 9; border: 3px solid var(--accent); background: #111; box-shadow: 0 0 12px rgba(255,127,0,.35); }
    .display-preview-frame iframe { display: block; width: 100%; height: 100%; border: 0; background: #111; }
    .display-preview-note { margin-top: 8px; font-size: 12px; color: #555; }
    .image-picker-panel { min-width: 0; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); font-weight: 500; }
    p { margin: 0; color: #4b4b4b; }
    .dropzone { width: min(100%, 520px); min-height: 300px; display: grid; place-items: center; padding: 20px; border: 2px dashed #777; background: rgba(255,255,255,.28); cursor: pointer; }
    .dropzone.is-dragging { border-color: var(--accent); background: rgba(255,127,0,.12); }
    .dropzone span { color: #555; }
    .preview { display: none; width: 100%; height: 300px; object-fit: contain; background: #111; }
    .preview.is-visible { display: block; }
    .file-name { min-height: 20px; font-size: 13px; }
    .servizio-files { display: none; width: min(100%, 520px); grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; padding: 10px; border: 1px solid rgba(0,0,0,.35); background: #f0f0f0; }
    .servizio-files.is-visible { display: grid; }
    .servizio-file-card { min-width: 0; padding: 6px; border: 2px solid transparent; background: #fff; color: #111; cursor: pointer; text-align: center; }
    .servizio-file-card:hover, .servizio-file-card.is-selected { border-color: var(--accent); }
    .servizio-file-card img { display: block; width: 100%; height: 90px; object-fit: cover; margin-bottom: 5px; }
    .servizio-file-card span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    button, .select-button { min-height: 42px; padding: 10px 18px; border: 1px solid rgba(0,0,0,.35); background: #f0f0f0; color: #111; font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); font-weight: 700; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    input[type="file"] { display: none; }
    .error { min-height: 20px; color: #8f0000; font-size: 13px; }
    @media (max-width: 820px) {
      body { padding: 12px; }
      main { grid-template-columns: 1fr; padding: 18px; }
    }
  </style>
</head>
<body>
  <section class="window">
    <header><span>Servizio / Scegli immagine</span><button id="close-btn" type="button" aria-label="Chiudi">X</button></header>
    <main>
      <section class="display-preview-panel" aria-labelledby="display-preview-title">
        <h1 id="display-preview-title">DISPLAY attualmente usato</h1>
        <div class="display-preview-frame">
          <iframe src="../../Bordero/pages/display.html" title="Anteprima del DISPLAY attualmente usato"></iframe>
        </div>
        <p class="display-preview-note">Anteprima del rettangolo del monitor secondario.</p>
      </section>
      <section class="image-picker-panel" aria-labelledby="image-picker-title">
        <h1 id="image-picker-title">Scegli l'immagine da pubblicare</h1>
        <p>Seleziona un'immagine dal PC per visualizzarla sul monitor secondario.</p>
        <label id="dropzone" class="dropzone" for="image-input">
          <span id="dropzone-text">Clicca qui o trascina un'immagine</span>
          <img id="preview" class="preview" alt="Anteprima immagine selezionata" />
        </label>
        <input id="image-input" type="file" accept="image/*" />
        <div id="servizio-files" class="servizio-files" aria-label="Immagini nella cartella VSC_SERVIZIO"></div>
        <div id="file-name" class="file-name"></div>
        <div class="actions">
          <button id="select-btn" class="select-button" type="button">Scegli immagine</button>
          <button id="publish-btn" class="primary" type="button" disabled>Pubblica immagine</button>
          <button id="cancel-btn" type="button">Annulla</button>
        </div>
        <div id="error" class="error" aria-live="polite"></div>
      </section>
    </main>
  </section>
  <script>
    (() => {
      const input = document.getElementById('image-input');
      const dropzone = document.getElementById('dropzone');
      const dropzoneText = document.getElementById('dropzone-text');
      const preview = document.getElementById('preview');
      const fileName = document.getElementById('file-name');
      const publishButton = document.getElementById('publish-btn');
      const error = document.getElementById('error');
      const servizioFiles = document.getElementById('servizio-files');
      let selectedFile = null;

      async function loadServizioFiles() {
        try {
          const response = await fetch(`/api/servizio/images?t=${Date.now()}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const payload = await response.json();
          const files = Array.isArray(payload?.files) ? payload.files : [];
          servizioFiles.innerHTML = '';
          files.forEach((file) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'servizio-file-card';
            const image = document.createElement('img');
            image.src = file.url;
            image.alt = file.name;
            const name = document.createElement('span');
            name.textContent = file.name;
            card.append(image, name);
            card.addEventListener('click', () => {
              servizioFiles.querySelectorAll('.is-selected').forEach((item) => item.classList.remove('is-selected'));
              card.classList.add('is-selected');
              selectServizioFile(file.url, file.name);
            });
            servizioFiles.appendChild(card);
          });
          servizioFiles.classList.add('is-visible');
          if (!files.length) error.textContent = 'La cartella C:\\VSC_SERVIZIO non contiene immagini.';
        } catch (loadError) {
          error.textContent = 'Impossibile leggere la cartella C:\\VSC_SERVIZIO.';
        }
      }

      function selectServizioFile(url, name) {
        if (!url) return;
        selectedFile = { name, dataUrl: url };
        preview.src = url;
        preview.classList.add('is-visible');
        dropzoneText.style.display = 'none';
        fileName.textContent = name;
        publishButton.disabled = false;
      }

      function setFile(file) {
        error.textContent = '';
        if (!file || !file.type.startsWith('image/')) {
          selectedFile = null;
          preview.removeAttribute('src');
          preview.classList.remove('is-visible');
          dropzoneText.style.display = '';
          fileName.textContent = '';
          publishButton.disabled = true;
          if (file) error.textContent = 'Seleziona un file immagine valido.';
          return;
        }
        selectedFile = file;
        preview.src = URL.createObjectURL(file);
        preview.classList.add('is-visible');
        dropzoneText.style.display = 'none';
        fileName.textContent = file.name;
        publishButton.disabled = false;
      }

      input.addEventListener('change', () => setFile(input.files[0]));
      document.getElementById('select-btn').addEventListener('click', async () => {
        if (!window.electronAPI?.filePicker?.pickImageFromServizio) {
          await loadServizioFiles();
          return;
        }

        const result = await window.electronAPI.filePicker.pickImageFromServizio();
        if (!result?.canceled && result.dataUrl) {
          selectedFile = { name: result.name || 'immagine', dataUrl: result.dataUrl };
          preview.src = result.dataUrl;
          preview.classList.add('is-visible');
          dropzoneText.style.display = 'none';
          fileName.textContent = selectedFile.name;
          publishButton.disabled = false;
        }
      });
      dropzone.addEventListener('dragover', (event) => { event.preventDefault(); dropzone.classList.add('is-dragging'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-dragging'));
      dropzone.addEventListener('drop', (event) => { event.preventDefault(); dropzone.classList.remove('is-dragging'); setFile(event.dataTransfer.files[0]); });

      publishButton.addEventListener('click', () => {
        if (!selectedFile) return;
        const publishDataUrl = (dataUrl) => {
          const id = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const payload = { id, name: selectedFile.name, dataUrl };
          localStorage.setItem(`userform-servizio-logo:${id}`, JSON.stringify(payload));
          localStorage.setItem('userform-servizio-logo:last', JSON.stringify(payload));
          const route = `/USERFORM/pages/SERVIZIO-PUBBLICA.html?mode=logo&id=${encodeURIComponent(id)}`;
          if (window.electronAPI?.windowManager?.openSecondaryPage) {
            window.electronAPI.windowManager.openSecondaryPage({ path: route }).catch(() => window.open(`SERVIZIO-PUBBLICA.html?mode=logo&id=${encodeURIComponent(id)}`, '_blank'));
          } else {
            window.open(`SERVIZIO-PUBBLICA.html?mode=logo&id=${encodeURIComponent(id)}`, '_blank');
          }
        };
        if (selectedFile.dataUrl) {
          publishDataUrl(selectedFile.dataUrl);
          return;
        }
        const reader = new FileReader();
        reader.onload = () => publishDataUrl(reader.result);
        reader.readAsDataURL(selectedFile);
      });

      ['close-btn', 'cancel-btn'].forEach((id) => document.getElementById(id).addEventListener('click', () => {
        window.location.href = 'SERVIZIO.html';
      }));
    })();
  </script>
</body>
</html>
