<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15251f">
  <title>Monster Country Group | Display Mobile</title>
  <link rel="stylesheet" href="mobile-style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand-row"><div><p class="eyebrow">Monster Country Group</p><h1>Display live</h1></div><div class="connection-state" id="connectionState" aria-live="polite">Connessione...</div></div>
    <section class="next-card"><span class="next-label">Prossima coreografia</span><strong class="next-title" id="nextCoreoValue">--</strong><span class="next-detail" id="nextCoreoDetail"></span></section>
    <dl class="event-details">
      <div><dt>DJ</dt><dd id="mobileDj">--</dd></div><div><dt>Data</dt><dd id="mobileData">--</dd></div><div><dt>Luogo</dt><dd id="mobileLuogo">--</dd></div><div><dt>Evento</dt><dd id="mobileEvento">--</dd></div><div class="completed"><dt>Eseguite</dt><dd id="mobileCompleted">0/0</dd></div>
    </dl>
  </header>
  <main class="display-content" id="scrollContainer">
    <div class="list-header"><span>Coreografie richieste</span><time id="updatedAt">In attesa dati</time></div>
    <section class="choreography-list" id="dataBody" aria-live="polite"></section>
    <section class="empty-state" id="emptyState" hidden><h2>Nessuna coreografia richiesta</h2><p>Il display si aggiorna automaticamente quando la serata viene avviata.</p></section>
  </main>
  <dialog class="settings-panel" id="settingsPanel"><form method="dialog"><div class="settings-heading"><h2>Scorrimento</h2><button class="icon-button" value="close" aria-label="Chiudi impostazioni">x</button></div><label>Velocita <output id="speedValue">18</output><input type="range" id="speed" min="1" max="30" value="18"></label><label>Pausa ai bordi <output id="pauseValue">2 s</output><input type="range" id="pause" min="0" max="10" value="2"></label><div class="settings-actions"><button type="button" id="scrollToggle">Pausa</button><button type="button" id="fullscreenToggle">Schermo intero</button></div></form></dialog>
  <nav class="bottom-bar" aria-label="Comandi display"><a href="../Bordero/index.html">Torna a Bordero</a><button id="refreshButton">Aggiorna</button><button id="settingsButton">Impostazioni</button></nav>
  <script src="mobile-google-config.js"></script>
  <script src="mobile-script.js"></script>
</body>
</html>
